<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMUSA - Analítico Comercial Protegido 2026</title>
    <!-- Tipografía Ejecutiva y Soporte Gráfico Local -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #0F172A; 
            --bg-card: rgba(30, 41, 59, 0.7); 
            --borde-card: rgba(255, 255, 255, 0.08);
            --azul-electrico: #0052FF;
            --verde-menta: #2ECC71;
            --coral-suave: #FF6B6B;
            --texto-principal: #F8F9FA;
            --texto-secundario: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-principal); min-height: 100vh; padding: 15px; overflow-x: hidden; }

        /* PANTALLA DE LOGIN PREMIUM SEGURA */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--bg-principal); display: flex; justify-content: center; 
            align-items: center; z-index: 9999; transition: opacity 0.5s ease;
        }
        .login-box {
            background: var(--bg-card); border: 1px solid var(--borde-card); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center; display: flex; flex-direction: column; gap: 20px;
        }
        .login-box h2 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
        .login-box h2 span { color: var(--azul-electrico); }
        .login-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .login-group label { font-size: 11px; text-transform: uppercase; color: var(--texto-secundario); font-weight: 700; }
        .login-input {
            background: #1E293B; border: 1px solid var(--borde-card); color: var(--texto-principal);
            padding: 12px; border-radius: 8px; font-size: 14px; outline: none; width: 100%;
        }
        .login-btn {
            background: var(--azul-electrico); color: var(--texto-principal); border: none;
            padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.3s; margin-top: 10px;
        }
        .login-btn:hover { background: #0044DD; }
        .login-error { color: var(--coral-suave); font-size: 13px; font-weight: 600; display: none; }
    </style>
    <style>
        /* INTERFAZ DEL DASHBOARD (OCULTA POR DEFECTO ANTES DE AUTENTICAR) */
        .app-wrapper { display: none; flex-direction: column; gap: 20px; }

        header {
            background: linear-gradient(135deg, #1E293B, #0F172A); border: 1px solid var(--borde-card);
            border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        header h1 span { color: var(--azul-electrico); }

        .status-badge {
            background: rgba(46, 204, 113, 0.15); border: 1px solid var(--verde-menta);
            color: var(--verde-menta); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .main-content { display: flex; flex-direction: column; gap: 20px; }

    </style>
<!-- 🛡️ ESCUDO DE CONTROL DE ACCESO CORPORATIVO (OWASP ASVS L2) -->

</head>
<body>

<!-- 🔒 CONTROL DE ACCESO SEGURO BLOQUEANTE -->
<form id="loginForm">
    <div class="login-overlay" id="pantalla-login">
        
        <div class="login-box">
            <h2>MAMUSA <span>BI Engine</span></h2>
            <p style="color: var(--texto-secundario); font-size: 13px;">Introduzca las credenciales autorizadas para acceder a los estados financieros consolidados.</p>
            
            <!-- ⚠️ Nota: Se le añade style="display: none;" para que empiece limpio -->
            <div class="login-error" id="errorMessage" style="display: none;">❌ Usuario o Contraseña Incorrectos</div>
            
            <div class="login-group">
                <label>Usuario Corporativo</label>
                <input type="text" class="login-input" id="username" name="username" placeholder="ej: gerencia_bi" autocomplete="off">
            </div>
            
            <div class="login-group">
                <label>Contraseña de Seguridad</label>
                <input type="password" class="login-input" id="password"  name="password" placeholder="••••••••">
            </div>
            
            <!-- 🚀 CORREGIDO: Se añade de forma explícita el type="submit" -->
            <button type="submit" class="login-btn">Acceder al Sistema</button>
        </div>

    </div>
</form>
  
    <!-- Sincronización del archivo maestro externo -->
    <script src="config.js?v=2"></script>
    <script>


// ================================================================================
// 🔑 CONTROLADOR MAESTRO DE ACCESO Y AUTENTICACIÓN (ANTI-COMPETENCIA)
// ================================================================================
document.addEventListener("DOMContentLoaded", function() {
    const formulario = document.getElementById('loginForm');
    
    if (!formulario) {
        console.error("🛑 Error: No se encontró ningún formulario con id='loginForm'");
        return;
    }

    formulario.addEventListener('submit', async function(e) {
        e.preventDefault();
        console.log("🚀 Evento Submit capturado con éxito. Conectando al backend local...");
        // Aseguramos la extracción directa de los valores de las cajas de texto
        const txtUsuario = document.getElementById('username');
        const txtPassword = document.getElementById('password');

        if (!txtUsuario || !txtPassword) {
            console.error("🛑 Error: No se encontraron los inputs 'username' o 'password' en el HTML.");
            return;
        }

        const usernameInput = txtUsuario.value.trim();
        const passwordInput = txtPassword.value;

        const errorMessage = document.getElementById('errorMessage');
        const submitButton = e.target.querySelector('button.login-btn') || e.target.querySelector('button');

        if (submitButton) {
            submitButton.disabled = true;
            submitButton.innerText = "Autenticando...";
        }
        if (errorMessage) errorMessage.style.display = "none";

        // Estructura oficial OAuth2 requerida por FastAPI
        // 🚀 CORREGIDO: Enlazamos el objeto URLSearchParams directamente al FormData nativo del formulario
        const formData = new URLSearchParams(new FormData(formulario));

        // 🚀 CORREGIDO: Enviamos de forma unificada ambas llaves para cumplir con el esquema Pydantic
        const datosLogin = {
            email: usernameInput,    // 👈 Requerido por el validador Pydantic de tu FastAPI (Imagen 1)
            username: usernameInput, // 👈 Requerido por el estándar general de OAuth2
            password: passwordInput
        };

        try {
            console.log("Enviando JSON unificado hacia el motor asíncrono MAMUSA...");

            const response = await fetch("https://mamusa-backend-api.onrender.com/api/v1/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(datosLogin)
            });

            if (response.status === 422) {
                const errorDetallado = await response.json();
                console.error("❌ Estructura rechazada por FastAPI (422):", errorDetallado);
                throw new Error("Campos inválidos en el esquema del backend (422).");
            }

            const data = await response.json();

            if (response.ok && data.access_token) {
                console.log("✅ Autenticación exitosa en MAMUSA BI.");
                localStorage.setItem('mamusa_access_token', data.access_token);
                localStorage.setItem('mamusa_token_type', data.token_type || 'Bearer');
                console.log("¡Acceso concedido al Motor BI! Conexión establecida de forma exitosa.");
                window.location.href = "dashboard.html";

            } else {
                throw new Error(data.detail || "Usuario o Contraseña Incorrectos");
            }

        } catch (error) {
            console.error("🛑 Excepción en pasarela de acceso:", error);
            if (errorMessage) {
                errorMessage.innerText = error.message;
                errorMessage.style.display = "block";
            }
        } finally {
            if (submitButton) {
                submitButton.disabled = false;
                submitButton.innerText = "Acceder al Sistema";
            }
        }

    });
});
</script>
</body>
</html>
